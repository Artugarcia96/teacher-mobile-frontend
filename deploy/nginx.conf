# nginx config for the coteacher-frontend container on the VPS.
# Serves the built SPA and proxies /api to the backend container.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Docker DNS, resolved per request so nginx starts even if the backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://coteacher-backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
