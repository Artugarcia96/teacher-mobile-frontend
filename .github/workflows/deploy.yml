name: Deploy frontend to VPS

on:
  push:
    branches: [front-initial]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        env:
          # Same-origin by default: nginx on the VPS proxies /api to the backend.
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: |
          npm ci
          npx vite build  # `npm run build` also runs tsc, which currently fails
          tar -czf dist.tar.gz -C dist .

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist.tar.gz,deploy/deploy.sh,deploy/nginx.conf
          target: /tmp/coteacher-frontend-deploy

      - name: Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /tmp/coteacher-frontend-deploy
            bash deploy/deploy.sh "$PWD/dist.tar.gz"
            rm -rf /tmp/coteacher-frontend-deploy
