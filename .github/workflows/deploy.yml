name: Deploy frontend to VPS

on:
  push:
    branches: [front-initial]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: git archive --format=tar.gz -o frontend.tar.gz HEAD

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: frontend.tar.gz,deploy/deploy.sh
          target: /tmp/coteacher-frontend-deploy

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: API_URL
          script: |
            set -e
            cd /tmp/coteacher-frontend-deploy
            bash deploy/deploy.sh "$PWD/frontend.tar.gz" "${API_URL:-https://46.225.232.228/api}"
